# One command: `docker compose up --build`  →  web http://localhost:3000 · API http://localhost:4000/api/docs
# Runs fully offline with LLM_PROVIDER=mock and EMBEDDINGS_PROVIDER=mock (no API keys).
name: healtrip

x-db-passwords: &db-passwords
  MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-migrator-dev}
  API_DB_PASSWORD: ${API_DB_PASSWORD:-api-dev}
  RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-rag-dev}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: healtrip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-dev}
      <<: *db-passwords
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healtrip"]
      interval: 5s
      retries: 20

  # One-shot: schema migrations, least-privilege grants, idempotent seed. Uses the migrator role.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: build }
    working_dir: /repo/apps/api
    command: sh -c "npx prisma migrate deploy && npx prisma db execute --file prisma/grants.sql --schema prisma/schema.prisma && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://healtrip_migrator:${MIGRATOR_PASSWORD:-migrator-dev}@postgres:5432/healtrip?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Internal only: no published port. Reachable from the api container as http://rag:8001.
  rag:
    build: { context: ., dockerfile: apps/rag/Dockerfile }
    environment:
      RAG_DATABASE_URL: postgresql://healtrip_rag:${RAG_DB_PASSWORD:-rag-dev}@postgres:5432/healtrip
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-compose-local-token}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_AUTO_INGEST: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The runtime image sets NODE_ENV=production, so the API refuses the code default "dev-internal-token";
  # compose uses its own local default (shared with rag). Override RAG_INTERNAL_TOKEN for anything non-local.
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    environment:
      DATABASE_URL: postgresql://healtrip_api:${API_DB_PASSWORD:-api-dev}@postgres:5432/healtrip?schema=public
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_TOOL_CHOICE: ${OPENAI_TOOL_CHOICE:-required}
      RAG_URL: http://rag:8001
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-compose-local-token}
      EXPOSE_TRACE: "true"
      LOG_LEVEL: info
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rag: { condition: service_started } # the API degrades gracefully without RAG

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000 # called from the browser
        NEXT_PUBLIC_SHOW_TRACE: "true"
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
