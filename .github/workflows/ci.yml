name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint · typecheck · test · build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rag:
    name: Pytest (RAG service, pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: healtrip_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_RAG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healtrip_test
    defaults:
      run: { working-directory: apps/rag }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/rag/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  compose:
    name: Docker compose smoke test (mock LLM, no keys)
    runs-on: ubuntu-latest
    needs: [node, rag]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait api web
      - name: Health + one chat turn per path (triage, agent)
        run: |
          # RAG may still be ingesting when the API is up (health = degraded): wait for "ok"
          for i in $(seq 1 30); do curl -fsS localhost:4000/api/health | grep -q '"status":"ok"' && break; sleep 3; done
          curl -fsS localhost:4000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -X POST localhost:4000/api/chat -H 'content-type: application/json' \
            -d '{"message":"chest pain spreading to my left arm and sweating","locale":"en"}' | grep -q '"nextStep":"EMERGENCY_NOW"'
          curl -fsS -X POST localhost:4000/api/chat -H 'content-type: application/json' \
            -d '{"message":"Which cardiologist has experience with heart stents?","locale":"en"}' | grep -q 'doctor_bio:doc-cai-card-01:en#0'
          curl -fsS localhost:3000 | grep -q 'HealTrip'
      - if: failure()
        run: docker compose logs --no-color
